<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08743e"><title>GoGo — Groceries & Stays</title><link rel="stylesheet" href="styles.css"></head><body>
<header><div class="brand"><span class="mark">GO</span><b>GoGo</b></div><div class="head-actions"><button class="ghost" id="ordersBtn">Orders</button><button id="cartBtn">Basket <span id="count">0</span></button></div></header>
<main><section class="hero"><p>LOCAL. FAST. EASY.</p><h1>Groceries and stays, closer to home.</h1><div class="services"><button class="service active" data-view="groceries">🛒 Groceries</button><button class="service" data-view="stays">🏡 Stays</button></div></section>
<section id="groceries"><div class="merchant"><div><small>GROCERIES</small><h2>Moratiwa SUPERSPAR</h2><p>Moratiwa Crossing, Monsterlus · Delivery & collection</p></div><b>SPAR</b></div><input id="search" placeholder="Search groceries…"><div id="cats" class="cats"></div><div id="products" class="grid"></div></section>
<section id="stays" hidden><div class="section-head"><div><small>STAYS</small><h2>Lodges & Guest Houses</h2><p>Find a local room or onboard your property.</p></div><button id="onboardBtn">List your property</button></div><div id="stayGrid" class="staygrid"></div></section></main>
<div id="drawer" class="drawer"><button class="x" id="close">×</button><h2>Your basket</h2><div id="items"></div><div class="summary"><span>Subtotal</span><b id="subtotal">R0.00</b><span>Delivery</span><b id="delivery">R0.00</b><span>Total</span><b id="total">R0.00</b></div><button class="primary wide" id="checkout">Checkout</button></div>
<div id="modal" class="modal"><div class="sheet"><button class="x" id="modalClose">×</button><div id="modalBody"></div></div></div>
<nav class="bottom"><button data-view="groceries">🛒<span>Shop</span></button><button data-view="stays">🏡<span>Stays</span></button><button id="bottomOrders">📦<span>Orders</span></button><button id="accountBtn">👤<span>Account</span></button></nav>
<script src="app.js"></script></body></html>
