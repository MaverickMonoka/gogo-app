name: GoGo Cloudflare deployment
on:
  workflow_dispatch:
    inputs:
      confirm_database_ready:
        description: "Confirm D1 DB binding and six application tables are present"
        required: true
        type: boolean
        default: false
jobs:
  deploy:
    if: ${{ inputs.confirm_database_ready }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Deploy GoGo Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: a65bce303c9035afa94b046cd260b164
      - name: Verify public health endpoint
        run: |
          curl --fail --show-error --silent --retry 3 --retry-delay 5 \
            https://gogo-app.pkhardware2.workers.dev/api/health
