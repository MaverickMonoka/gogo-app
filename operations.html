<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GoGo Operations</title><style>:root{font-family:system-ui,sans-serif;color:#173124;background:#f3f6f3}*{box-sizing:border-box}body{margin:0}header{background:#08743e;color:white;padding:20px max(20px,5vw);display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}h1{margin:0;font-size:25px}main{max-width:1100px;margin:auto;padding:20px}button,select,input{font:inherit;padding:11px;border-radius:9px;border:1px solid #cddbd2}button{background:#08743e;color:white;cursor:pointer;border:0}button:disabled{opacity:.5;cursor:wait}.secondary{background:#e7f2eb;color:#07592e}.panel{background:white;border-radius:15px;padding:18px;margin-bottom:16px;box-shadow:0 2px 14px #0001}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.row>*{min-width:0}input{flex:1;min-width:180px}#orders{display:grid;gap:14px}.order{background:white;border-radius:14px;padding:18px;box-shadow:0 2px 12px #0001}.order h3{margin:0 0 8px}.meta{color:#64786c;font-size:14px}.tag{background:#e4f2e9;color:#065d30;padding:5px 10px;border-radius:99px;font-size:13px;font-weight:700}.items{padding-left:18px}.error{color:#b00020}.ok{color:#08743e}.stat{font-weight:800;font-size:22px}a{color:inherit}#message{min-height:25px}nav a{margin-left:12px}@media(max-width:600px){.row>input,.row>button{width:100%}}</style></head><body><header><div><h1>GoGo Operations</h1><small>Merchant & driver control centre</small></div><nav><a href="/">Customer app</a> <a href="/driver-rides.html">Passenger rides</a></nav></header><main><div class="panel"><div class="row"><label for="role">Dashboard</label><select id="role"><option value="merchant">Merchant</option><option value="driver">Driver</option></select><input id="token" type="password" placeholder="Dashboard access token" autocomplete="off"><button id="connect">Connect</button><button class="secondary" id="refresh">Refresh</button></div><p class="meta">Access tokens are used only for API requests and are not saved in browser storage. Close this tab to clear access.</p><p id="message" role="status"></p></div><div class="panel row"><div>Orders shown<br><span class="stat" id="count">0</span></div><div>Total value<br><span class="stat" id="value">R0.00</span></div><div><label for="filter">Status filter</label><br><select id="filter"><option value="">All</option><option>paid</option><option>accepted</option><option>preparing</option><option>ready</option><option>out_for_delivery</option><option>delivered</option><option>collected</option><option>cancelled</option></select></div></div><section id="orders" aria-live="polite"><p>Enter your access token to load orders.</p></section></main><script src="/operations.js"></script></body></html>
