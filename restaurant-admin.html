<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GoGo Restaurant Admin</title><link rel="stylesheet" href="/styles.css"><style>main{max-width:900px}.panel{background:white;border-radius:18px;padding:20px;margin:16px 0}.entry{padding:15px;border-bottom:1px solid #eee}.entry button{margin:4px;background:#f36b13;color:white;padding:9px 12px;border-radius:9px}.field input,.field select{width:100%}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style></head><body><header><div class="brand"><span class="mark">GO</span><b>Restaurant Admin</b></div><a href="/">Customer app</a></header><main><section class="panel"><h2>Restaurant operations</h2><p>Restricted to GoGo administrators. Do not share this access token.</p><div class="field"><label>Admin token<input type="password" id="token" autocomplete="off"></label></div><button class="primary" id="load">Connect</button><p id="status" role="status"></p></section><section class="panel"><h2>Restaurant applications</h2><div id="restaurants">Connect to load.</div></section><section class="panel"><h2>Add menu item</h2><form id="menuForm"><div class="field"><label>Restaurant ID<input name="restaurant_id" type="number" min="1" required></label></div><div class="field"><label>Item name<input name="name" required></label></div><div class="field"><label>Description<input name="description"></label></div><div class="field"><label>Price in rand<input name="price" type="number" min="0" step=".01" required></label></div><button class="primary">Add item</button></form></section><section class="panel"><h2>Food orders</h2><div id="orders">Connect to load.</div></section></main><script src="/restaurant-admin.js"></script></body></html>
